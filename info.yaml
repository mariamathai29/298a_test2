# Tiny Tapeout project information
project:
  title:        "Sign-Sign LMS Adaptive Filter (4-tap)"
  author:       "Maria Mathai"
  discord:      ""
  description:  "4-tap sign-sign LMS adaptive FIR filter with SPI-style streaming I/O"
  language:     "Verilog"
  clock_hz:     40000000

  tiles: "1x1"

  top_module:  "tt_um_adaptive_filter"

  source_files:
    - "tt_um_adaptive_filter.v"
    - "filter_core.v"
    - "spi.v"
    - "ctl_ff.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "SCLK_IN"
  ui[1]: "CS_IN (active low)"
  ui[2]: "MOSI_u_in"
  ui[3]: ""
  ui[4]: "MOSI_r_in"
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "SCLK_OUT"
  uo[1]: "FS_OUT"
  uo[2]: "MOSI_y_out"
  uo[3]: "MOSI_e_out"
  uo[4]: "MOSI_w_out (monitor weight)"
  uo[5]: ""
  uo[6]: "debug_o1 (sticky overrun)"
  uo[7]: "debug_o2 (sticky saturation)"

  # Bidirectional pins (all used as inputs)
  uio[0]: "adapt_en"
  uio[1]: "mu_sel[0]"
  uio[2]: "mu_sel[1]"
  uio[3]: "mu_sel[2]"
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
